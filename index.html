<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E23C30">
<title>Gym Builder</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="shortcut icon" href="assets/icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><img class="mark" src="assets/icons/mark-wide.png" alt="">Gym <em>Builder</em></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Modo">
          <button id="mTreino" aria-pressed="true">Treino</button>
          <button id="mEstudo" aria-pressed="false">Estudo</button>
        </div>
        <button class="iconbtn" id="theme" title="Tema">◐</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>

<main class="wrap" id="main"></main>

<div class="rest" id="rest">
  <div class="in">
    <div><div class="lbl">Descanso · próximo</div><div class="next" id="restNext">—</div></div>
    <div class="t" id="restT">1:30</div>
    <button id="restSkip">Pular</button>
  </div>
</div>

<script src="videos.js"></script>
<script src="fichas/leo.js"></script>
<script src="app.js"></script>
</body>
</html>
